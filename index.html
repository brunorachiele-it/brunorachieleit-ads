<script>
  const COUNTER_NAMESPACE = "brunorachiele_ads_v2";
  let creds = null;

  let clientsSha = null;
  let adsConfigSha = null;
  let currentStatsSha = null;

  let clientsList = [];
  let bannersList = [];
  let activeMonthArchive = { month: "", updatedAt: "", days: {} };
  let currentMonthlyRows = [];
  let historicalGrandTotal = 0;

  const SLOT_LABELS = {
    "header-top": "Testata Alta (Header Top)",
    "sidebar-rassegna": "Sidebar (Laterale)",
    "in-article-1": "Dentro gli Articoli",
    "footer-partner": "Footer Partner"
  };

  function showStatus(msg, type) {
    const bar = document.getElementById("statusBar");
    bar.textContent = msg;
    bar.className = "status-bar " + type;
  }

  function switchTab(tabId, btnEl) {
    document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
    document.querySelectorAll(".nav-tab").forEach(b => b.classList.remove("active"));
    document.getElementById(tabId).classList.add("active");
    if (btnEl) btnEl.classList.add("active");
  }

  function getActiveCreds() {
    if (creds && creds.owner && creds.repo && creds.token) return creds;
    const owner = (document.getElementById("loginOwner")?.value || localStorage.getItem("br_ads_owner") || "brunorachiele-it").trim();
    const repo = (document.getElementById("loginRepo")?.value || localStorage.getItem("br_ads_repo") || "brunorachieleit-ads").trim();
    const token = (document.getElementById("loginToken")?.value || localStorage.getItem("br_ads_token") || "").trim();
    if (!owner || !repo || !token) return null;
    creds = { owner, repo, token };
    return creds;
  }

  // ==================== HELPER API GITHUB ====================
  async function ghGetFile(path) {
    const c = getActiveCreds();
    if (!c) throw new Error("Credenziali GitHub mancanti. Effettua nuovamente l'accesso.");
    const url = `https://api.github.com/repos/${c.owner}/${c.repo}/contents/${path}?t=${Date.now()}`;
    const res = await fetch(url, {
      headers: {
        "Authorization": `Bearer ${c.token}`,
        "Accept": "application/vnd.github+json"
      }
    });
    if (res.status === 404) return null;
    if (!res.ok) throw new Error(`Errore lettura file ${path} (HTTP ${res.status}).`);
    const data = await res.json();
    const decoded = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ""))));
    return { sha: data.sha, json: JSON.parse(decoded) };
  }

  async function ghPutFile(path, jsonObj, sha, commitMsg) {
    const c = getActiveCreds();
    if (!c) throw new Error("Credenziali GitHub mancanti. Effettua nuovamente l'accesso.");
    const jsonString = JSON.stringify(jsonObj, null, 2);
    const encoded = btoa(unescape(encodeURIComponent(jsonString)));
    const url = `https://api.github.com/repos/${c.owner}/${c.repo}/contents/${path}`;
    const body = { message: commitMsg, content: encoded };
    if (sha) body.sha = sha;

    const res = await fetch(url, {
      method: "PUT",
      headers: {
        "Authorization": `Bearer ${c.token}`,
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json"
      },
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error(`Errore salvataggio file ${path} (HTTP ${res.status}).`);
    const result = await res.json();
    return result.content.sha;
  }

  async function ghListFolder(folderPath) {
    const c = getActiveCreds();
    if (!c) return [];
    const url = `https://api.github.com/repos/${c.owner}/${c.repo}/contents/${folderPath}?t=${Date.now()}`;
    const res = await fetch(url, {
      headers: {
        "Authorization": `Bearer ${c.token}`,
        "Accept": "application/vnd.github+json"
      }
    });
    if (!res.ok) return [];
    const items = await res.json();
    return Array.isArray(items) ? items : [];
  }

  // ==================== AUTENTICAZIONE E CARICAMENTO INIZIALE ====================
  function initLoginScreen() {
    document.getElementById("loginOwner").value = localStorage.getItem("br_ads_owner") || "brunorachiele-it";
    document.getElementById("loginRepo").value = localStorage.getItem("br_ads_repo") || "brunorachieleit-ads";
    const savedToken = localStorage.getItem("br_ads_token") || "";
    document.getElementById("loginToken").value = savedToken;

    if (savedToken) {
      handleLogin(true);
    }
  }

  async function handleLogin(isAuto = false) {
    const owner = document.getElementById("loginOwner").value.trim();
    const repo = document.getElementById("loginRepo").value.trim();
    const token = document.getElementById("loginToken").value.trim();
    const errBox = document.getElementById("loginError");

    if (!owner || !repo || !token) {
      errBox.textContent = "Compila tutti e tre i campi per accedere.";
      errBox.style.display = "block";
      return;
    }

    errBox.style.display = "none";
    creds = { owner, repo, token };

    try {
      const configRes = await ghGetFile("ads-config.json");
      if (!configRes) {
        throw new Error("Impossibile trovare ads-config.json nel repository.");
      }
      adsConfigSha = configRes.sha;
      bannersList = Array.isArray(configRes.json.banners) ? configRes.json.banners : [];

      const clientsRes = await ghGetFile("clients/clients.json");
      if (clientsRes) {
        clientsSha = clientsRes.sha;
        clientsList = Array.isArray(clientsRes.json.clients) ? clientsRes.json.clients : [];
      } else {
        clientsList = [];
        clientsSha = await ghPutFile(
          "clients/clients.json",
          { updatedAt: new Date().toISOString().slice(0, 10), clients: [] },
          null,
          "Inizializzazione cartella clients/"
        );
      }

      // Migrazione automatica se esistevano vecchie "campaigns"
      if (Array.isArray(configRes.json.campaigns) && configRes.json.campaigns.length > 0 && bannersList.length === 0) {
        configRes.json.campaigns.forEach(old => {
          const cid = "cli-" + old.id;
          clientsList.push({
            id: cid,
            name: old.client || "Cliente",
            contactPerson: (old.billing && old.billing.contactPerson) || "",
            vatNumber: (old.billing && old.billing.vatNumber) || "",
            email: (old.billing && old.billing.clientEmail) || "",
            phone: "",
            planTier: (old.billing && old.billing.planTier) || "START Mensile (25,00 € / mese)",
            defaultLabel: old.label || "Spazio Sponsorizzato",
            notes: (old.billing && old.billing.adminNotes) || "",
            active: old.active !== false
          });
          bannersList.push({
            id: old.id,
            clientId: cid,
            title: "Banner Principale",
            slots: old.slots || ["sidebar-rassegna"],
            weight: old.weight || 1,
            startDate: old.startDate || "",
            endDate: old.endDate || "",
            imageUrl: old.imageUrl || "",
            targetUrl: old.targetUrl || "",
            active: old.active !== false
          });
        });
        await saveClientsToGitHub("Migrazione clienti da ads-config.json");
        await saveBannersToGitHub("Migrazione banner da ads-config.json");
      }

      localStorage.setItem("br_ads_owner", owner);
      localStorage.setItem("br_ads_repo", repo);
      localStorage.setItem("br_ads_token", token);

      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("appShell").style.display = "block";
      document.getElementById("repoBadge").textContent = `${owner}/${repo}`;

      const today = new Date().toISOString().slice(0, 10);
      document.getElementById("bStartDate").value = today;
      document.getElementById("statsMonthPicker").value = today.slice(0, 7);

      renderAllUI();
      await loadMonthStats(false);
    } catch (e) {
      if (document.getElementById("appShell").style.display === "block") {
        showStatus("Avviso caricamento: " + e.message, "err");
      } else {
        creds = null;
        if (!isAuto) {
          errBox.textContent = e.message;
          errBox.style.display = "block";
        }
      }
    }
  }

  function logout() {
    localStorage.removeItem("br_ads_token");
    location.reload();
  }

  // ==================== SALVATAGGIO CLIENTI ====================
  async function saveClientsToGitHub(msg) {
    clientsSha = await ghPutFile(
      "clients/clients.json",
      { updatedAt: new Date().toISOString().slice(0, 10), clients: clientsList },
      clientsSha,
      msg || "Aggiornamento anagrafiche clients/"
    );
  }

  async function saveBannersToGitHub(msg) {
    const enrichedBanners = bannersList.map(b => {
      const owner = clientsList.find(c => c.id === b.clientId);
      return {
        ...b,
        clientName: owner ? owner.name : (b.clientName || "Partner"),
        clientActive: owner ? owner.active !== false : true,
        label: owner ? owner.defaultLabel : (b.label || "Spazio Sponsorizzato")
      };
    });

    adsConfigSha = await ghPutFile(
      "ads-config.json",
      { version: "2.1", updatedAt: new Date().toISOString().slice(0, 10), banners: enrichedBanners },
      adsConfigSha,
      msg || "Aggiornamento ads-config.json"
    );
  }

  async function saveClient() {
    const name = document.getElementById("cName").value.trim();
    if (!name) {
      showStatus("Inserisci la Ragione Sociale o il Nome del Cliente.", "err");
      return;
    }

    const editId = document.getElementById("editClientId").value;
    const clientObj = {
      id: editId || "cli-" + Date.now(),
      name,
      contactPerson: document.getElementById("cContact").value.trim(),
      vatNumber: document.getElementById("cVat").value.trim(),
      email: document.getElementById("cEmail").value.trim(),
      phone: document.getElementById("cPhone").value.trim(),
      planTier: document.getElementById("cPlan").value,
      defaultLabel: document.getElementById("cDefaultLabel").value,
      notes: document.getElementById("cNotes").value.trim(),
      active: true
    };

    try {
      showStatus("Salvataggio anagrafica in clients/clients.json...", "info");
      if (editId) {
        const idx = clientsList.findIndex(c => c.id === editId);
        if (idx !== -1) {
          clientObj.active = clientsList[idx].active;
          clientsList[idx] = clientObj;
        }
      } else {
        clientsList.push(clientObj);
      }
      await saveClientsToGitHub(`Cliente: ${name}`);
      await saveBannersToGitHub(`Sincronizzazione banner per cliente: ${name}`);
      resetClientForm();
      renderAllUI();
      showStatus("Cliente salvato nella cartella clients/ con successo!", "ok");
    } catch (e) {
      showStatus(e.message, "err");
    }
  }

  function editClient(id) {
    const c = clientsList.find(item => item.id === id);
    if (!c) return;
    document.getElementById("clientFormTitle").textContent = "Modifica Cliente: " + c.name;
    document.getElementById("editClientId").value = c.id;
    document.getElementById("cName").value = c.name;
    document.getElementById("cContact").value = c.contactPerson || "";
    document.getElementById("cVat").value = c.vatNumber || "";
    document.getElementById("cEmail").value = c.email || "";
    document.getElementById("cPhone").value = c.phone || "";
    if (c.planTier) document.getElementById("cPlan").value = c.planTier;
    if (c.defaultLabel) document.getElementById("cDefaultLabel").value = c.defaultLabel;
    document.getElementById("cNotes").value = c.notes || "";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  async function toggleClient(id) {
    const c = clientsList.find(item => item.id === id);
    if (!c) return;
    c.active = !c.active;
    try {
      showStatus("Aggiornamento stato cliente...", "info");
      await saveClientsToGitHub(`Stato cliente ${c.name}: ${c.active}`);
      await saveBannersToGitHub(`Stato banner cliente ${c.name}`);
      renderAllUI();
      showStatus("Stato cliente aggiornato.", "ok");
    } catch (e) {
      showStatus(e.message, "err");
    }
  }

  async function deleteClient(id) {
    if (!confirm("Eliminare questo cliente da clients/clients.json? Verranno rimossi anche i suoi banner.")) return;
    clientsList = clientsList.filter(c => c.id !== id);
    bannersList = bannersList.filter(b => b.clientId !== id);
    try {
      showStatus("Eliminazione cliente...", "info");
      await saveClientsToGitHub("Eliminazione cliente");
      await saveBannersToGitHub("Rimozione banner cliente eliminato");
      renderAllUI();
      showStatus("Cliente eliminato.", "ok");
    } catch (e) {
      showStatus(e.message, "err");
    }
  }

  function resetClientForm() {
    document.getElementById("clientFormTitle").textContent = "Nuova Anagrafica Cliente / Inserzionista";
    document.getElementById("editClientId").value = "";
    document.getElementById("cName").value = "";
    document.getElementById("cContact").value = "";
    document.getElementById("cVat").value = "";
    document.getElementById("cEmail").value = "";
    document.getElementById("cPhone").value = "";

  // ==================== GESTIONE BANNER ====================
  function previewLocalBanner() {
    const file = document.getElementById("bFile").files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function (e) {
      const img = document.getElementById("bPrevImg");
      img.src = e.target.result;
      img.style.display = "block";
      document.getElementById("bPrevPlaceholder").style.display = "none";
    };
    reader.readAsDataURL(file);
  }

  function updatePreviewFromUrl() {
    const url = document.getElementById("bImageUrl").value.trim();
    const img = document.getElementById("bPrevImg");
    if (url) {
      img.src = url;
      img.style.display = "block";
      document.getElementById("bPrevPlaceholder").style.display = "none";
    }
  }

  async function uploadBannerFile(file) {
    const c = getActiveCreds();
    if (!c) throw new Error("Credenziali GitHub mancanti.");
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = async function () {
        try {
          const base64Content = reader.result.split(",")[1];
          const cleanName = Date.now() + "-" + file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
          const path = `banners/${cleanName}`;
          const apiUrl = `https://api.github.com/repos/${c.owner}/${c.repo}/contents/${path}`;

          const res = await fetch(apiUrl, {
            method: "PUT",
            headers: {
              "Authorization": `Bearer ${c.token}`,
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              message: `Upload banner ${cleanName}`,
              content: base64Content
            })
          });

          if (!res.ok) throw new Error("Errore durante il caricamento dell'immagine in banners/.");
          resolve(`https://ads.brunorachiele.it/${path}`);
        } catch (err) {
          reject(err);
        }
      };
      reader.readAsDataURL(file);
    });
  }

  async function saveBanner() {
    const clientId = document.getElementById("bClientId").value;
    const title = document.getElementById("bTitle").value.trim();
    const targetUrl = document.getElementById("bTargetUrl").value.trim();
    const startDate = document.getElementById("bStartDate").value;
    const endDate = document.getElementById("bEndDate").value;
    const weight = Number(document.getElementById("bWeight").value) || 1;
    const slots = Array.from(document.querySelectorAll(".slot-cb:checked")).map(cb => cb.value);
    const file = document.getElementById("bFile").files[0];
    let imageUrl = document.getElementById("bImageUrl").value.trim();
    const editId = document.getElementById("editBannerId").value;

    if (!clientId) {
      showStatus("Crea prima almeno un Cliente nella scheda 'Gestione Clienti'.", "err");
      return;
    }
    if (!title || !targetUrl || slots.length === 0) {
      showStatus("Inserisci Nome/Formato banner, URL di destinazione e almeno uno Slot.", "err");
      return;
    }
    if (!file && !imageUrl) {
      showStatus("Carica un file immagine oppure incolla l'URL del banner.", "err");
      return;
    }

    try {
      showStatus("Pubblicazione banner in corso...", "info");
      if (file) {
        imageUrl = await uploadBannerFile(file);
      }

      const bannerObj = {
        id: editId || "ad_" + Date.now(),
        clientId,
        title,
        slots,
        weight,
        startDate,
        endDate,
        imageUrl,
        targetUrl,
        active: true
      };

      if (editId) {
        const idx = bannersList.findIndex(b => b.id === editId);
        if (idx !== -1) {
          bannerObj.active = bannersList[idx].active;
          bannersList[idx] = bannerObj;
        }
      } else {
        bannersList.push(bannerObj);
      }

      await saveBannersToGitHub(`Banner: ${title}`);
      resetBannerForm();
      renderAllUI();
      showStatus("Banner pubblicato! Sarà visibile su brunorachiele.it entro 1-2 minuti.", "ok");
    } catch (e) {
      showStatus(e.message, "err");
    }
  }

  function editBanner(id) {
    const b = bannersList.find(item => item.id === id);
    if (!b) return;
    document.getElementById("bannerFormTitle").textContent = "Modifica Banner: " + b.title;
    document.getElementById("editBannerId").value = b.id;
    document.getElementById("bClientId").value = b.clientId;
    document.getElementById("bTitle").value = b.title;
    document.getElementById("bTargetUrl").value = b.targetUrl;
    document.getElementById("bStartDate").value = b.startDate || "";
    document.getElementById("bEndDate").value = b.endDate || "";
    document.getElementById("bWeight").value = b.weight || 1;
    document.getElementById("bImageUrl").value = b.imageUrl;
    document.querySelectorAll(".slot-cb").forEach(cb => {
      cb.checked = (b.slots || []).includes(cb.value);
    });
    updatePreviewFromUrl();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  async function toggleBanner(id) {
    const b = bannersList.find(item => item.id === id);
    if (!b) return;
    b.active = !b.active;
    try {
      showStatus("Aggiornamento stato banner...", "info");
      await saveBannersToGitHub(`Stato banner ${b.title}: ${b.active}`);
      renderAllUI();
      showStatus("Stato banner aggiornato.", "ok");
    } catch (e) {

  async function deleteBanner(id) {
    if (!confirm("Vuoi eliminare definitivamente questo banner?")) return;
    bannersList = bannersList.filter(b => b.id !== id);
    try {
      showStatus("Eliminazione banner...", "info");
      await saveBannersToGitHub("Eliminazione banner");
      renderAllUI();
      showStatus("Banner eliminato.", "ok");
    } catch (e) {

  function resetBannerForm() {
    document.getElementById("bannerFormTitle").textContent = "Aggiungi Banner Pubblicitario a un Cliente";
    document.getElementById("editBannerId").value = "";
    document.getElementById("bTitle").value = "";
    document.getElementById("bTargetUrl").value = "";
    document.getElementById("bImageUrl").value = "";
    document.getElementById("bFile").value = "";
    document.getElementById("bEndDate").value = "";

    document.getElementById("bPrevPlaceholder").style.display = "block";
  }

  // ==================== STATISTICHE MENSILI & ARCHIVIO IN stats/ ====================
  async function fetchSingleCounter(key) {
    try {
      const res = await fetch(`https://api.counterapi.dev/v1/${COUNTER_NAMESPACE}/${key}`);
      if (!res.ok) return 0;
      const data = await res.json();
      return Number(data.count) || 0;
    } catch {
      return 0;
    }
  }

  function getDaysInMonth(yearMonth) {
    const [y, m] = yearMonth.split("-").map(Number);
    const daysCount = new Date(y, m, 0).getDate();
    const list = [];
    for (let d = 1; d <= daysCount; d++) {
      list.push(`${yearMonth}-${String(d).padStart(2, "0")}`);
    }
    return list;
  }

  async function computeGrandTotalFromArchive() {
    try {
      const files = await ghListFolder("stats");
      let grandTotal = 0;
      for (const f of files) {
        if (f.name && f.name.endsWith(".json")) {
          const res = await ghGetFile(`stats/${f.name}`);
          if (res && res.json && res.json.days) {
            Object.values(res.json.days).forEach(dayMap => {
              Object.values(dayMap).forEach(val => { grandTotal += Number(val) || 0; });
            });
          }
        }
      }
      historicalGrandTotal = grandTotal;
      document.getElementById("kpiTotalClicks").textContent = historicalGrandTotal;
    } catch (e) {
      console.warn("Calcolo totale storico:", e);
    }
  }

  async function loadMonthStats(shouldSaveToGitHub = false) {
    const monthVal = document.getElementById("statsMonthPicker").value || new Date().toISOString().slice(0, 7);
    const tbody = document.getElementById("dailyClicksTable");
    const noteEl = document.getElementById("archiveStatusNote");

    document.getElementById("kpiMonthLabel").textContent = "Mese: " + monthVal;
    tbody.innerHTML = '<tr><td colspan="4" style="color:#64748b;">Lettura archivio mensile e contatori live...</td></tr>';

    const archivePath = `stats/${monthVal}.json`;
    let existing = null;
    try {
      existing = await ghGetFile(archivePath);
    } catch (e) {
      console.warn("File archivio non ancora presente:", e);
    }

    currentStatsSha = existing ? existing.sha : null;
    const savedDays = (existing && existing.json && existing.json.days) ? existing.json.days : {};

    const todayStr = new Date().toISOString().slice(0, 10);
    const currentMonthStr = todayStr.slice(0, 7);
    const days = getDaysInMonth(monthVal).filter(d => d <= todayStr);

    const mergedDays = JSON.parse(JSON.stringify(savedDays));
    let hasChanges = false;

    if ((monthVal === currentMonthStr || !existing) && bannersList.length > 0) {
      for (const day of days) {
        if (!mergedDays[day]) mergedDays[day] = {};
        await Promise.all(bannersList.map(async (b) => {
          const safeId = String(b.id).replace(/[^a-zA-Z0-9_-]/g, "_");
          const liveVal = await fetchSingleCounter(`${safeId}_${day}`);
          const prevVal = Number(mergedDays[day][b.id]) || 0;
          if (liveVal > prevVal) {
            mergedDays[day][b.id] = liveVal;
            hasChanges = true;
          }
        }));
      }
    }

    activeMonthArchive = {
      month: monthVal,
      updatedAt: todayStr,
      days: mergedDays
    };

    if ((shouldSaveToGitHub || hasChanges) && days.length > 0) {
      try {
        currentStatsSha = await ghPutFile(
          archivePath,
          activeMonthArchive,
          currentStatsSha,
          `Archivio click mensile ${monthVal}`
        );
        noteEl.innerHTML = `Archivio <strong>${archivePath}</strong> sincronizzato e salvato su GitHub.`;
      } catch (e) {
        console.warn("Salvataggio stats rimandato:", e);
      }
    } else if (existing) {
      noteEl.innerHTML = `Dati caricati dall'archivio storico <strong>${archivePath}</strong> (aggiornato al ${existing.json.updatedAt || monthVal}).`;
    }

    renderMonthFromArchiveOrLive();
    await computeGrandTotalFromArchive();
  }

  async function syncAndArchiveCurrentMonth() {
    showStatus("Sincronizzazione click live e salvataggio nella cartella stats/ su GitHub...", "info");
    await loadMonthStats(true);
    showStatus("Statistiche mensili archiviate con successo in stats/!", "ok");
  }

  function renderMonthFromArchiveOrLive() {
    const monthVal = activeMonthArchive.month;
    const clientFilter = document.getElementById("statsClientFilter").value || "ALL";
    const tbody = document.getElementById("dailyClicksTable");

    const targetBanners = bannersList.filter(b => clientFilter === "ALL" || b.clientId === clientFilter);
    const targetBannerIds = new Set(targetBanners.map(b => b.id));

    const todayStr = new Date().toISOString().slice(0, 10);
    const days = getDaysInMonth(monthVal).filter(d => d <= todayStr);

    let monthTotal = 0;
    const bannerMonthTotals = {};
    targetBanners.forEach(b => { bannerMonthTotals[b.id] = 0; });

    const rows = [];

    days.forEach(day => {
      const dayRecord = activeMonthArchive.days[day] || {};
      let daySum = 0;
      const details = [];

      Object.entries(dayRecord).forEach(([bId, countVal]) => {
        const count = Number(countVal) || 0;
        if (count > 0 && (clientFilter === "ALL" || targetBannerIds.has(bId))) {
          daySum += count;
          bannerMonthTotals[bId] = (bannerMonthTotals[bId] || 0) + count;
          const bObj = bannersList.find(x => x.id === bId);
          const owner = bObj ? clientsList.find(c => c.id === bObj.clientId) : null;
          const labelName = owner ? owner.name : (bObj ? bObj.clientName : "Partner");
          const formatName = bObj ? bObj.title : bId;
          details.push(`${labelName} (${formatName}): ${count}`);
        }
      });

      monthTotal += daySum;
      rows.push({ date: day, clicks: daySum, details });
    });

    currentMonthlyRows = rows;

    document.getElementById("kpiMonthClicks").textContent = monthTotal;
    document.getElementById("kpiActiveClients").textContent = clientsList.filter(c => c.active).length;
    document.getElementById("kpiActiveBanners").textContent = bannersList.filter(b => b.active).length;

    const maxDay = Math.max(1, ...rows.map(r => r.clicks));
    if (rows.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" style="color:#64748b;">Nessun giorno trascorso nel mese selezionato.</td></tr>';
    } else {
      tbody.innerHTML = rows.map(r => {
        const pct = Math.round((r.clicks / maxDay) * 100);
        const formattedDate = r.date.split("-").reverse().join("/");
        return `
          <tr>
            <td><strong>${formattedDate}</strong></td>
            <td><span class="badge ${r.clicks > 0 ? "badge-on" : "badge-off"}">${r.clicks} click</span></td>
            <td><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div></td>
            <td style="font-size:12.5px; color:#475569;">${r.details.length ? r.details.join(" • ") : "-"}</td>
          </tr>
        `;
      }).join("");
    }

    const bStatsBody = document.getElementById("bannerStatsTable");
    if (targetBanners.length === 0) {
      bStatsBody.innerHTML = '<tr><td colspan="5" style="color:#64748b;">Nessun banner associato.</td></tr>';
    } else {
      bStatsBody.innerHTML = targetBanners.map(b => {
        const owner = clientsList.find(c => c.id === b.clientId);
        const cClicks = bannerMonthTotals[b.id] || 0;
        const slotsTxt = (b.slots || []).map(s => SLOT_LABELS[s] || s).join(", ");
        return `
          <tr>
            <td><strong>${owner ? owner.name : (b.clientName || "N/D")}</strong></td>
            <td>${b.title}</td>
            <td>${slotsTxt}</td>
            <td><strong>${cClicks}</strong></td>
            <td>
              <button class="btn btn-pdf" onclick="downloadClientMonthlyPDF('${b.clientId}')">PDF Report Mese</button>
            </td>
          </tr>
        `;
      }).join("");
    }

    bannersList.forEach(b => {
      const cell = document.getElementById(`b-clicks-${b.id}`);
      if (cell) {
        let bTotal = 0;
        Object.values(activeMonthArchive.days).forEach(dayRec => {
          bTotal += Number(dayRec[b.id]) || 0;
        });
        cell.textContent = bTotal + " click";
      }
    });
  }

  // ==================== GENERAZIONE PDF 1: ANAGRAFICA CLIENTE ====================
  function downloadClientRegistryPDF(clientId) {
    const c = clientsList.find(item => item.id === clientId);
    if (!c || !window.jspdf) return;

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
    const todayStr = new Date().toLocaleDateString("it-IT");
    const clientBanners = bannersList.filter(b => b.clientId === c.id);

    doc.setFillColor(15, 23, 42);
    doc.rect(0, 0, 210, 38, "F");
    doc.setTextColor(255, 255, 255);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(18);
    doc.text("brunorachiele.it", 16, 17);
    doc.setFont("helvetica", "normal");
    doc.setFontSize(10);
    doc.setTextColor(203, 213, 225);
    doc.text("Scheda Anagrafica Cliente & Riepilogo Spazi Pubblicitari B2B", 16, 25);
    doc.text("Data emissione: " + todayStr + "  |  Codice Cliente: " + c.id, 16, 31);

    let y = 50;
    doc.setTextColor(30, 58, 138);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(12);
    doc.text("1. ANAGRAFICA INSERZIONISTA", 16, y);
    doc.setDrawColor(203, 213, 225);
    doc.line(16, y + 2, 194, y + 2);
    y += 10;

    const rows = [
      ["Ragione Sociale / Azienda:", c.name],
      ["Referente:", c.contactPerson || "Non specificato"],
      ["Partita IVA / Codice Fiscale:", c.vatNumber || "Non specificato"],
      ["Email:", c.email || "Non specificata"],
      ["Telefono:", c.phone || "Non specificato"],
      ["Pacchetto Sottoscritto:", c.planTier || "-"],
      ["Etichetta Trasparenza JTI:", c.defaultLabel || "Spazio Sponsorizzato"],
      ["Note Contrattuali:", c.notes || "Nessuna nota aggiuntiva"]
    ];

    doc.setFontSize(10.5);
    rows.forEach(([k, v]) => {
      doc.setFont("helvetica", "bold");
      doc.setTextColor(71, 85, 105);
      doc.text(k, 16, y);
      doc.setFont("helvetica", "normal");
      doc.setTextColor(15, 23, 42);
      const lines = doc.splitTextToSize(String(v), 120);
      doc.text(lines, 72, y);
      y += lines.length * 6 + 2;
    });

    y += 6;
    doc.setTextColor(30, 58, 138);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(12);
    doc.text(`2. FORMATI E SPAZI PUBBLICITARI ASSOCIATI (${clientBanners.length})`, 16, y);
    doc.line(16, y + 2, 194, y + 2);
    y += 10;

    if (clientBanners.length === 0) {
      doc.setFont("helvetica", "normal");
      doc.setFontSize(10);
      doc.setTextColor(100, 116, 139);
      doc.text("Nessun banner grafico ancora associato a questa anagrafica.", 16, y);
      y += 10;
    } else {
      clientBanners.forEach((b, index) => {
        const slotsReadable = (b.slots || []).map(s => SLOT_LABELS[s] || s).join(", ");
        doc.setFont("helvetica", "bold");
        doc.setFontSize(10);
        doc.setTextColor(15, 23, 42);
        doc.text(`${index + 1}. ${b.title} [${b.active ? "ATTIVO" : "IN PAUSA"}]`, 16, y);
        y += 5;
        doc.setFont("helvetica", "normal");
        doc.setFontSize(9.5);
        doc.setTextColor(71, 85, 105);
        doc.text(`Posizioni: ${slotsReadable}  |  Validità: ${b.startDate || "Sempre"} -> ${b.endDate || "Illimitata"}`, 20, y);
        y += 5;
        doc.text(`URL destinazione: ${b.targetUrl}`, 20, y);
        y += 8;
      });
    }

    y += 4;
    doc.setFillColor(239, 246, 255);
    doc.setDrawColor(191, 219, 254);
    doc.roundedRect(16, y, 178, 32, 3, 3, "FD");
    doc.setFont("helvetica", "bold");
    doc.setFontSize(9.5);
    doc.setTextColor(30, 58, 138);
    doc.text("CONFORMITÀ EDITORIALE JTI & CONDIZIONI", 20, y + 7);
    doc.setFont("helvetica", "normal");
    doc.setFontSize(8.8);
    doc.setTextColor(30, 41, 59);
    const noteJti = "In linea con la Linea Editoriale di brunorachiele.it e lo standard europeo Journalism Trust Initiative (JTI), i contenuti promozionali sono sempre contrassegnati da etichetta trasparente e restano indipendenti dalla redazione. Le pre-adesioni tramite Lettera d'Intenti non prevedono versamenti anticipati prima dell'avvio operativo.";
    doc.text(doc.splitTextToSize(noteJti, 170), 20, y + 13);

    doc.setFontSize(8.5);
    doc.setTextColor(100, 116, 139);
    doc.text("brunorachiele.it • Sede operativa: San Pietro a Maida (CZ) • info@brunorachiele.it • trust.brunorachiele.it", 16, 282);

    doc.save(`Anagrafica_${c.name.replace(/[^a-zA-Z0-9]/g, "_")}.pdf`);
  }

  // ==================== GENERAZIONE PDF 2: REPORT CLICK GIORNO PER GIORNO ====================
  function downloadClientMonthlyPDF(clientId) {
    document.getElementById("statsClientFilter").value = clientId;
    renderMonthFromArchiveOrLive();
    downloadMonthlyClicksPDF();
  }

  function downloadMonthlyClicksPDF() {
    if (!window.jspdf) return;
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });

    const monthVal = document.getElementById("statsMonthPicker").value;
    const clientFilter = document.getElementById("statsClientFilter").value;
    const clientObj = clientFilter !== "ALL" ? clientsList.find(c => c.id === clientFilter) : null;
    const subjectTitle = clientObj ? clientObj.name : "Riepilogo Generale Portale";
    const totalClicksMonth = currentMonthlyRows.reduce((acc, r) => acc + r.clicks, 0);

    doc.setFillColor(15, 23, 42);
    doc.rect(0, 0, 210, 38, "F");
    doc.setTextColor(255, 255, 255);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(17);
    doc.text("brunorachiele.it • REPORT TRAFFICO & CLICK", 16, 16);
    doc.setFont("helvetica", "normal");
    doc.setFontSize(10);
    doc.setTextColor(203, 213, 225);
    doc.text(`Inserzionista: ${subjectTitle}   |   Periodo di riferimento: ${monthVal}`, 16, 24);
    doc.text(`Totale Click Certificati nel Mese: ${totalClicksMonth}`, 16, 31);

    let y = 48;
    doc.setFillColor(241, 245, 249);
    doc.rect(16, y - 5, 178, 8, "F");
    doc.setFont("helvetica", "bold");
    doc.setFontSize(9.5);
    doc.setTextColor(15, 23, 42);
    doc.text("DATA", 20, y);
    doc.text("CLICK", 55, y);
    doc.text("DETTAGLIO FORMATI CLICCATI", 82, y);
    y += 7;

    doc.setFont("helvetica", "normal");
    doc.setFontSize(9);

    currentMonthlyRows.forEach((row) => {
      if (y > 270) {
        doc.addPage();
        y = 20;
      }
      const dateIt = row.date.split("-").reverse().join("/");
      const detailTxt = row.details.length ? row.details.join(" | ") : "Nessun click registrato";
      const wrapped = doc.splitTextToSize(detailTxt, 110);

      doc.setTextColor(15, 23, 42);
      doc.text(dateIt, 20, y);
      doc.setFont("helvetica", row.clicks > 0 ? "bold" : "normal");
      doc.text(String(row.clicks), 57, y);
      doc.setFont("helvetica", "normal");
      doc.setTextColor(71, 85, 105);
      doc.text(wrapped, 82, y);

      const rowHeight = Math.max(6, wrapped.length * 4.5 + 1.5);
      doc.setDrawColor(226, 232, 240);
      doc.line(16, y + rowHeight - 2, 194, y + rowHeight - 2);
      y += rowHeight;
    });

    y += 6;
    if (y > 272) { doc.addPage(); y = 20; }
    doc.setFont("helvetica", "bold");
    doc.setFontSize(11);
    doc.setTextColor(30, 58, 138);
    doc.text(`TOTALE COMPLESSIVO MESE (${monthVal}): ${totalClicksMonth} CLICK`, 16, y);

    doc.setFont("helvetica", "normal");
    doc.setFontSize(8.5);
    doc.setTextColor(100, 116, 139);
    doc.text("Report generato da ads.brunorachiele.it • info@brunorachiele.it", 16, 285);

    const safeName = subjectTitle.replace(/[^a-zA-Z0-9]/g, "_");
    doc.save(`Report_Click_${safeName}_${monthVal}.pdf`);
  }

  // ==================== RENDERING TABELLE E SELECT ====================
  function renderAllUI() {
    const bSelect = document.getElementById("bClientId");
    const sSelect = document.getElementById("statsClientFilter");
    const prevFilter = sSelect.value;

    if (clientsList.length === 0) {
      bSelect.innerHTML = '<option value="">-- Crea prima un cliente nella scheda Gestione Clienti --</option>';
    } else {
      bSelect.innerHTML = clientsList.map(c => `<option value="${c.id}">${c.name}</option>`).join("");
    }

    sSelect.innerHTML = '<option value="ALL">Tutti i Clienti</option>' +
      clientsList.map(c => `<option value="${c.id}">${c.name}</option>`).join("");
    if (prevFilter) sSelect.value = prevFilter;

    const cTbody = document.getElementById("clientsTable");
    if (clientsList.length === 0) {
      cTbody.innerHTML = '<tr><td colspan="6" style="color:#64748b;">Nessun cliente registrato. Compila il modulo qui sopra per salvarlo in clients/clients.json.</td></tr>';
    } else {
      cTbody.innerHTML = clientsList.map(c => {
        const countBanners = bannersList.filter(b => b.clientId === c.id).length;
        return `
          <tr>
            <td><strong>${c.name}</strong><br><small style="color:#64748b;">${c.contactPerson || ""}</small></td>
            <td>${c.email || "-"}<br><small style="color:#64748b;">${c.vatNumber || ""}</small></td>
            <td>${c.planTier || "-"}</td>
            <td><strong>${countBanners}</strong> banner</td>
            <td><span class="badge ${c.active ? "badge-on" : "badge-off"}">${c.active ? "Attivo" : "Sospeso"}</span></td>
            <td>
              <div class="actions-cell">
                <button class="btn btn-pdf" onclick="downloadClientRegistryPDF('${c.id}')" title="Scarica PDF Anagrafica">PDF Anagrafica</button>
                <button class="btn btn-secondary" onclick="editClient('${c.id}')">Modifica</button>
                <button class="btn btn-secondary" onclick="toggleClient('${c.id}')">${c.active ? "Sospendi" : "Attiva"}</button>
                <button class="btn btn-danger" onclick="deleteClient('${c.id}')">Elimina</button>
              </div>
            </td>
          </tr>
        `;
      }).join("");
    }

    const bTbody = document.getElementById("bannersTable");
    if (bannersList.length === 0) {
      bTbody.innerHTML = '<tr><td colspan="7" style="color:#64748b;">Nessun banner inserito.</td></tr>';
    } else {
      bTbody.innerHTML = bannersList.map(b => {
        const owner = clientsList.find(c => c.id === b.clientId);
        const slotsTxt = (b.slots || []).map(s => SLOT_LABELS[s] || s).join(", ");
        return `
          <tr>
            <td><img src="${b.imageUrl}" class="thumb" alt="" /></td>
            <td><strong>${owner ? owner.name : (b.clientName || "Cliente")}</strong><br><small style="color:#1e3a8a; font-weight:600;">${b.title}</small></td>
            <td>${slotsTxt}</td>
            <td>${b.startDate || "Sempre"} → ${b.endDate || "Illimitata"}</td>
            <td id="b-clicks-${b.id}">0 click</td>
            <td><span class="badge ${b.active ? "badge-on" : "badge-off"}">${b.active ? "Attivo" : "In pausa"}</span></td>
            <td>
              <div class="actions-cell">
                <button class="btn btn-secondary" onclick="editBanner('${b.id}')">Modifica</button>
                <button class="btn btn-secondary" onclick="toggleBanner('${b.id}')">${b.active ? "Pausa" : "Attiva"}</button>
                <button class="btn btn-danger" onclick="deleteBanner('${b.id}')">Elimina</button>
              </div>
            </td>
          </tr>
        `;
      }).join("");
    }
  }

  initLoginScreen();
</script>
